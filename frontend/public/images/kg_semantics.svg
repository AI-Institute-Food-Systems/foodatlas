<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" fill="none">
  <!-- FoodAtlas graph semantics diagram. Nodes render as the entity
       badges used across the site (rounded-full pill, colored border +
       tinted fill, entity icon on the left). Colors + icon paths lifted
       from `frontend/components/entities/HeaderSection.tsx` and the
       matching icon components. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#575451" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f43f5e" />
    </marker>
    <marker id="arr-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#84cc16" />
    </marker>

    <!-- Entity icons — normalized to 20×20. Each is centered inside a
         viewBox translated to (0,0) so consumers can `<use>` and place
         them with a simple translate. -->
    <symbol id="icon-food" viewBox="0 -3.84 122.88 122.88">
      <path d="M29.03 100.46l20.79-25.21 9.51 12.13L41 110.69c-7.02 8.92-20.01-.48-11.97-10.23zm24.28-57.41c1.98-6.46 1.07-11.98-6.37-20.18L28.76 1c-2.58-3.03-8.66 1.42-6.12 5.09L37.18 24c2.75 3.34-2.36 7.76-5.2 4.32L16.94 9.8c-2.8-3.21-8.59 1.03-5.66 4.7 4.24 5.1 10.8 13.43 15.04 18.53 2.94 2.99-1.53 7.42-4.43 3.69L6.96 18.32c-2.19-2.38-5.77-.9-6.72 1.88-1.02 2.97 1.49 5.14 3.2 7.34L20.1 49.06c5.17 5.99 10.95 9.54 17.67 7.53 1.03-.31 2.29-.94 3.64-1.77l44.76 57.78c2.41 3.11 7.06 3.44 10.08.93l.69-.57c3.4-2.83 3.95-8 1.04-11.34l-47.4-54.46c1.38-1.54 2.39-3 2.73-4.11zm12.67 12.6l7.37-8.94C63.87 23.21 99-8.11 116.03 6.29 136.72 23.8 105.97 66 84.36 55.57l-8.73 11.09-9.65-11.01z" fill="currentColor" />
    </symbol>
    <symbol id="icon-chemical" viewBox="0 0 31.719 31.719">
      <path d="M21.558 4.61H10.161a2.205 2.205 0 00-2.229 2.221v2.441c0 1.028.682 1.896 1.571 2.167v15.364c0 .043.018.086.02.131.097 1.653 1.548 4.785 6.33 4.785 4.428 0 6.076-2.992 6.317-4.574.017-.113.045-.228.045-.342V11.44c.89-.271 1.572-1.139 1.572-2.167V6.831a2.206 2.206 0 00-2.229-2.221zm-.027 3.88a.768.768 0 01-.768.768h-.035a.77.77 0 00-.77.768v16.779s-.438 2.661-4.103 2.661c-3.916 0-4.102-2.661-4.102-2.661v-16.78a.768.768 0 00-.768-.768h-.036a.768.768 0 01-.768-.768v-.856c0-.424.344-.768.768-.768h9.81c.424 0 .768.344.768.768v.857h.004z" fill="currentColor" />
      <path d="M15.857 28.363c2.57 0 2.871-2.148 2.871-2.148v-7.113h-5.742v7.113c.002-.003.126 2.148 2.871 2.148z" fill="currentColor" />
      <circle cx="16.249" cy="14.484" r="1.426" fill="currentColor" />
      <circle cx="14.432" cy="9.555" r="1.427" fill="currentColor" />
      <circle cx="18.713" cy="1.989" r="1.384" fill="currentColor" />
      <circle cx="13.826" cy="0.822" r="0.822" fill="currentColor" />
    </symbol>
    <symbol id="icon-disease" viewBox="0 0 48 48">
      <path d="M44.5 22.1l-4.7-1.4a3.7 3.7 0 01-2.5-2.2 3.5 3.5 0 01.2-3.3l2.4-4.4a2.1 2.1 0 00-.3-2.4 2.1 2.1 0 00-2.4-.3l-4.4 2.4a3.5 3.5 0 01-3.3.2 3.7 3.7 0 01-2.2-2.5l-1.4-4.8a2 2 0 00-3.8 0l-1.4 4.8a3.7 3.7 0 01-2.2 2.5 3.5 3.5 0 01-3.3-.2l-4.4-2.4a2.1 2.1 0 00-2.4.3 2.1 2.1 0 00-.3 2.4l2.4 4.4a3.5 3.5 0 01.2 3.3 3.7 3.7 0 01-2.5 2.2l-4.7 1.4a2 2 0 000 3.8l4.7 1.4a3.7 3.7 0 012.5 2.2 3.5 3.5 0 01-.2 3.3l-2.4 4.4a2.1 2.1 0 00.3 2.4 2.1 2.1 0 002.4.3l4.4-2.4a3.5 3.5 0 013.3-.2 3.5 3.5 0 012.2 2.5l1.4 4.8a2 2 0 003.8 0l1.4-4.8a3.8 3.8 0 015.5-2.3l4.4 2.4a2 2 0 002.7-2.7l-2.4-4.4a3.5 3.5 0 01-.2-3.3 3.7 3.7 0 012.5-2.2l4.7-1.4a2 2 0 000-3.8zM21 25a4 4 0 114-4 4 4 0 01-4 4zm8 6a2 2 0 112-2 2 2 0 01-2 2z" fill="currentColor" />
    </symbol>
    <symbol id="icon-bioactivity" viewBox="0 0 48 48">
      <path fill="currentColor" d="M8 6h3v34h33v3H8z" />
      <path d="M12 37 C20 37 22 37 25 24 C28 11 30 11 42 11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>

    <style>
      /* Node pills — outline + tinted fill + inset shadow like Badge.tsx */
      .node-food      { fill: rgba(217,119,6,0.10);  stroke: #d97706; color: #d97706; }
      .node-chemical  { fill: rgba(8,145,178,0.10);  stroke: #0891b2; color: #0891b2; }
      .node-disease   { fill: rgba(168,85,247,0.10); stroke: #a855f7; color: #a855f7; }
      .node-bioact    { fill: rgba(16,185,129,0.10); stroke: #10b981; color: #10b981; }

      .node-label { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; font-weight: 600; text-transform: capitalize; }

      .edge-line  { stroke: #575451; stroke-width: 1.5; fill: none; }
      .edge-pos   { stroke: #84cc16; }
      .edge-neg   { stroke: #f43f5e; stroke-dasharray: 5 3; }

      .edge-label-bg { fill: #151414; }
      .edge-label    { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 10px; fill: #dad3cb; }
      .edge-code     { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 9px; fill: #FF7043; font-weight: 500; }

      .isa-loop { stroke: #575451; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- EDGES (drawn first so nodes overlap the line endpoints) -->

  <!-- r1: Food → Chemical (top horizontal) -->
  <g>
    <line class="edge-line" x1="175" y1="75" x2="345" y2="75" marker-end="url(#arr)" />
    <rect class="edge-label-bg" x="215" y="60" width="90" height="30" rx="4" />
    <text class="edge-code"  x="260" y="71" text-anchor="middle">r1</text>
    <text class="edge-label" x="260" y="85" text-anchor="middle">CONTAINS</text>
  </g>

  <!-- r3: Chemical → Disease (green solid = positive correlation) -->
  <g>
    <line class="edge-line edge-pos" x1="395" y1="105" x2="395" y2="235" marker-end="url(#arr-lime)" />
    <rect class="edge-label-bg" x="410" y="135" width="95" height="18" rx="4" />
    <text class="edge-code"  x="418" y="148" text-anchor="start">r3</text>
    <text class="edge-label" x="435" y="148" text-anchor="start">POS. CORR.</text>
  </g>

  <!-- r4: Chemical → Disease (dashed red = negative correlation) -->
  <g>
    <line class="edge-line edge-neg" x1="425" y1="105" x2="425" y2="235" marker-end="url(#arr-red)" />
    <rect class="edge-label-bg" x="410" y="160" width="95" height="18" rx="4" />
    <text class="edge-code"  x="418" y="173" text-anchor="start">r4</text>
    <text class="edge-label" x="435" y="173" text-anchor="start">NEG. CORR.</text>
  </g>

  <!-- r5: Food → Bioactivity (left vertical) -->
  <g>
    <line class="edge-line" x1="115" y1="105" x2="115" y2="235" marker-end="url(#arr)" />
    <rect class="edge-label-bg" x="15" y="155" width="95" height="18" rx="4" />
    <text class="edge-code"  x="20" y="168" text-anchor="start">r5</text>
    <text class="edge-label" x="37" y="168" text-anchor="start">EXHIBITS</text>
  </g>

  <!-- r6: Chemical → Bioactivity (diagonal) -->
  <g>
    <line class="edge-line" x1="355" y1="112" x2="175" y2="235" marker-end="url(#arr)" />
    <rect class="edge-label-bg" x="220" y="155" width="90" height="30" rx="4" transform="rotate(-31, 265, 170)" />
    <text class="edge-code"  x="265" y="166" text-anchor="middle" transform="rotate(-31, 265, 166)">r6</text>
    <text class="edge-label" x="265" y="180" text-anchor="middle" transform="rotate(-31, 265, 180)">MEASURED</text>
  </g>

  <!-- r2: IS_A self-loop on Food -->
  <g>
    <path class="isa-loop" d="M 75,50 C 40,15 10,50 35,75" marker-end="url(#arr)" />
    <text class="edge-code"  x="18" y="32" text-anchor="middle">r2</text>
    <text class="edge-label" x="18" y="20" text-anchor="middle">IS_A</text>
  </g>

  <!-- r2: IS_A self-loop on Chemical -->
  <g>
    <path class="isa-loop" d="M 445,50 C 480,15 510,50 485,75" marker-end="url(#arr)" />
    <text class="edge-code"  x="502" y="32" text-anchor="middle">r2</text>
    <text class="edge-label" x="502" y="20" text-anchor="middle">IS_A</text>
  </g>

  <!-- NODES — rendered as entity badges (icon + capitalized label,
       rounded-full pill, outlined with tinted fill). -->

  <!-- Food -->
  <g class="node-food" transform="translate(55, 55)">
    <rect class="node-food" width="120" height="40" rx="20" stroke-width="1.5" />
    <use href="#icon-food" x="12" y="12" width="16" height="16" />
    <text class="node-label" x="72" y="26" text-anchor="middle" fill="#d97706">Food</text>
  </g>

  <!-- Chemical -->
  <g class="node-chemical" transform="translate(345, 55)">
    <rect class="node-chemical" width="120" height="40" rx="20" stroke-width="1.5" />
    <use href="#icon-chemical" x="14" y="12" width="16" height="16" />
    <text class="node-label" x="76" y="26" text-anchor="middle" fill="#0891b2">Chemical</text>
  </g>

  <!-- Bioactivity -->
  <g class="node-bioact" transform="translate(55, 245)">
    <rect class="node-bioact" width="120" height="40" rx="20" stroke-width="1.5" />
    <use href="#icon-bioactivity" x="12" y="12" width="16" height="16" />
    <text class="node-label" x="76" y="26" text-anchor="middle" fill="#10b981">Bioactivity</text>
  </g>

  <!-- Disease -->
  <g class="node-disease" transform="translate(345, 245)">
    <rect class="node-disease" width="120" height="40" rx="20" stroke-width="1.5" />
    <use href="#icon-disease" x="12" y="12" width="16" height="16" />
    <text class="node-label" x="72" y="26" text-anchor="middle" fill="#a855f7">Disease</text>
  </g>
</svg>
