# Dependabot version updates. PRs target `dev` (never `main`).
# Minor + patch bumps are grouped into one PR per directory; major bumps
# stay as separate PRs so each one gets its own review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # The Next 14 -> 15 upgrade is a separate, planned project.
      # These packages must stay on the same major as `next`.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/third-parties"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /backend/api
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend/db
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      db-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend/ie
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ie-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend/kgc
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kgc-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /infra/aws
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      infra-aws-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
