name: CD (Staging)

# Mirrors cd.yml but for the dev → staging path. Push to `dev` builds new
# API + DB images, tags them with the SHA, and rolls them out to the
# FoodAtlas*-Staging CDK stacks (separate RDS, separate API ALB; shared
# Network / Storage / ECR with production).
#
# Production deploys (push to main) live in cd.yml. Keep these two
# workflows in sync when you change the build/deploy steps.

on:
  push:
    branches:
      - dev
    paths:
      - "backend/api/**"
      - "backend/db/**"
      - "infra/aws/**"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Reuses the existing "Preview" GH Environment — must hold AWS_ROLE_ARN
    # (copy of Production's value; same AWS account today) plus optional
    # STAGING_API_URL and API_CERT_ARN_STAGING.
    environment: Preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Same role as production for now — staging stacks live in the
          # same AWS account. When we move staging to the AIFS cluster
          # (see aws-migration-todo) swap to a staging-specific role ARN.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: ./backend/api/scripts/push-to-ecr.sh "${{ steps.tag.outputs.image_tag }}"

      - name: Build and push DB image
        run: ./backend/db/scripts/push-to-ecr.sh "${{ steps.tag.outputs.image_tag }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Resolve AWS account
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Sync CDK dependencies
        run: cd infra/aws && uv sync

      - name: Deploy Database + Jobs (staging)
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.account.outputs.id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          TAG: ${{ steps.tag.outputs.image_tag }}
          API_CERT_ARN: ${{ secrets.API_CERT_ARN_STAGING }}
        run: |
          cd infra/aws
          args=(
            --context "api_image_tag=$TAG"
            --context "db_image_tag=$TAG"
            --require-approval never
          )
          if [ -n "$API_CERT_ARN" ]; then
            args+=(--context "api_cert_arn=$API_CERT_ARN")
          fi
          uv run cdk deploy \
            FoodAtlasDatabaseStack-Staging \
            FoodAtlasJobsStack-Staging \
            "${args[@]}"

      - name: Deploy API (staging)
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.account.outputs.id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          TAG: ${{ steps.tag.outputs.image_tag }}
          API_CERT_ARN: ${{ secrets.API_CERT_ARN_STAGING }}
        run: |
          cd infra/aws
          args=(
            --context "api_image_tag=$TAG"
            --context "db_image_tag=$TAG"
            --require-approval never
          )
          if [ -n "$API_CERT_ARN" ]; then
            args+=(--context "api_cert_arn=$API_CERT_ARN")
          fi
          uv run cdk deploy FoodAtlasApiStack-Staging "${args[@]}"

      - name: Smoke test staging API
        # Resolves the ALB URL and bearer token from the stack's own
        # CfnOutputs rather than repo secrets, so this can't silently
        # skip itself the way the old `STAGING_API_URL`-gated version
        # did (that secret was never set, so the check never ran).
        #
        # Hits a real data endpoint, not just /health. This job deploys
        # new images but does NOT reload the database, so a merge that
        # changes the DB schema leaves new code querying an old
        # materialized schema. /health stays 200 through that; the data
        # endpoints 500. See the 2026-08-07 incident where
        # /bioactivity/chemicals was fully broken behind a green deploy.
        env:
          STACK: FoodAtlasApiStack-Staging
        run: |
          set -euo pipefail

          _output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK" --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          API_URL=$(_output ApiUrl)
          KEY_ARN=$(_output ApiKeySecretArn)
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "::error::Could not resolve ApiUrl from $STACK."
            exit 1
          fi
          echo "Smoke-testing $API_URL"

          API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "$KEY_ARN" --region "$AWS_REGION" \
            --query SecretString --output text)

          # Liveness first — retry while the new task set drains in.
          curl --fail --show-error --retry 10 --retry-delay 10 \
               --retry-all-errors --max-time 30 "$API_URL/health"
          echo "  /health OK"

          # Then one endpoint per materialized view that the merge could
          # have desynced. Each must return HTTP 200 AND a non-empty
          # `data` array — a 200 with `[]` means the MV is empty, which
          # is the other half of this failure mode.
          smoke() {
            label="$1"
            path="$2"
            status=$(curl --silent --show-error --max-time 30 \
                          -H "Authorization: Bearer $API_KEY" \
                          -o /tmp/smoke-body.json -w '%{http_code}' \
                          "$API_URL$path" || echo 000)
            if [ "$status" != "200" ]; then
              echo "::error::$label -- HTTP $status for $path"
              head -c 400 /tmp/smoke-body.json || true
              echo
              return 1
            fi
            # `.data` is an array on list endpoints and an object on
            # /metadata/statistics; `length > 0` covers both. A 200 with an
            # empty body is the other half of the stale-MV failure mode.
            if ! jq -e '(.data // .) | length > 0' /tmp/smoke-body.json >/dev/null 2>&1; then
              echo "::error::$label -- HTTP 200 but empty/unparseable data"
              head -c 400 /tmp/smoke-body.json || true
              echo
              return 1
            fi
            echo "  $label OK"
          }

          failed=0
          smoke "bioactivity/chemicals (mv_chemical_bioactivity)" \
                "/bioactivity/chemicals?common_name=anticancer&page=1" || failed=1
          smoke "food/composition (mv_food_chemical_composition)" \
                "/food/composition?common_name=onion&page=1" || failed=1
          smoke "metadata/statistics (mv_metadata_statistics)" \
                "/metadata/statistics" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::Staging smoke test failed. If the API itself deployed cleanly, the database is probably stale -- this workflow does not run the ETL. Reload with: STACK=FoodAtlasJobsStack-Staging infra/aws/scripts/run-data-load.sh staging-bioactivity"
            exit 1
          fi
          echo "All staging smoke tests passed."

          # ---- Source-filter invariants -------------------------------
          # Pure relationships between responses, so no fixture and no
          # expected row counts to keep in sync with the data:
          #
          #   total_rows(filter_source=s) == source_counts[s]
          #   max(a, b) <= total_rows(a+b) <= a + b
          #
          # The upper bound is the one that matters. When the WHERE
          # clause for a two-of-three selection went missing, `fdc+ptfi`
          # returned the UNFILTERED set -- 309 rows against singles of 0
          # and 106 -- so `309 > 0 + 106` fails loudly here.
          #
          # Pinned to `pepper (raw)` rather than the `onion` above
          # because onion and tomato are both {fdc:0, foodatlas:N,
          # ptfi:0}. A single-source food satisfies the pair invariant
          # even with the bug present, so it cannot catch anything. The
          # precondition below asserts that the pinned food still has two
          # non-zero sources -- an ETL reload that drops PTFI from pepper
          # then fails with "repin", instead of quietly going green
          # forever. Same trap the comment above this step describes.
          FOOD="pepper (raw)"
          enc_food=$(jq -rn --arg v "$FOOD" '$v|@uri')

          api_get() {
            curl --silent --show-error --max-time 30 \
                 -H "Authorization: Bearer $API_KEY" "$API_URL$1"
          }

          counts_json=$(api_get "/food/composition/counts?common_name=$enc_food")
          # `|| echo -1` and the `// -1` fallback keep a failed request or
          # an unparseable body from aborting under `set -e` before the
          # invariant gets a chance to report which comparison broke.
          total_rows_for() {
            api_get "/food/composition?common_name=$enc_food&page=1&filter_source=$1" \
              | jq -r '.metadata.total_rows // -1' || echo -1
          }

          nonzero=0
          for s in fdc foodatlas ptfi; do
            c=$(echo "$counts_json" | jq -r --arg s "$s" '.data.source_counts[$s] // 0')
            eval "count_$s=$c"
            # An `if`, not `[ ... ] && ...` -- the && form evaluates to
            # non-zero when the test is false, which under `set -e` at the
            # top of this step exits the whole job. fdc is 0 on pepper, so
            # that fires on the very first iteration.
            if [ "$c" -gt 0 ]; then
              nonzero=$((nonzero + 1))
            fi
          done

          if [ "$nonzero" -lt 2 ]; then
            echo "::error::'$FOOD' now has $nonzero non-zero sources (fdc=$count_fdc foodatlas=$count_foodatlas ptfi=$count_ptfi). This check needs a multi-source food to mean anything -- repin FOOD in cd-staging.yml."
            exit 1
          fi

          inv_failed=0
          for s in fdc foodatlas ptfi; do
            eval "expected=\$count_$s"
            actual=$(total_rows_for "$s")
            if [ "$actual" != "$expected" ]; then
              echo "::error::source filter -- filter_source=$s returned $actual rows but source_counts.$s is $expected. The rows path and the counts path disagree."
              inv_failed=1
            else
              echo "  filter_source=$s == source_counts.$s ($actual) OK"
            fi
          done

          for pair in "fdc foodatlas" "fdc ptfi" "foodatlas ptfi"; do
            set -- $pair
            eval "a=\$count_$1"; eval "b=\$count_$2"
            both=$(total_rows_for "$1%2B$2")
            lo=$a
            if [ "$b" -gt "$lo" ]; then
              lo=$b
            fi
            hi=$((a + b))
            if [ "$both" -lt "$lo" ] || [ "$both" -gt "$hi" ]; then
              echo "::error::source filter -- filter_source=$1+$2 returned $both rows, outside [$lo, $hi] implied by the singles ($1=$a, $2=$b). A result above the upper bound means the multi-source WHERE clause is missing."
              inv_failed=1
            else
              echo "  filter_source=$1+$2 = $both in [$lo, $hi] OK"
            fi
          done

          if [ "$inv_failed" -ne 0 ]; then
            exit 1
          fi
          echo "Composition source-filter invariants hold."
